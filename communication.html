  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* 禁止页面滚动 */
    }
    .top-app-bar{
      box-sizing: content-box;
    }
    .container-layout-main{
      height:100vh; /* 60px 是顶部导航栏的高度，调整为实际高度 */

<mdui-layout style="position: relative;overflow: hidden">

  <mdui-top-app-bar class="top-app-bar" scroll-behavior="elevate"
